---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]

btrfsSwapSubvol: /@swap

btrfsMountOptions:
  - filesystem: btrfs
    options: "defaults,noatime,compress=zstd:1,space_cache=v2,ssd,discard=async"
    subvolumeOptions:
      - subvolume: /@ostree
        options: "defaults,noatime,compress=zstd:1,space_cache=v2,ssd,discard=async"
      - subvolume: /@var
        options: "defaults,noatime,compress=zstd:1,space_cache=v2,ssd,discard=async"
      - subvolume: /@var_home
        options: "defaults,noatime,compress=zstd:1,space_cache=v2,ssd,discard=async"
      - subvolume: /@var_log
        options: "defaults,noatime,compress=zstd:1,space_cache=v2,ssd,discard=async"
      - subvolume: /@var_containers
        options: "defaults,noatime,compress=zstd:1,space_cache=v2,ssd,discard=async"
      - subvolume: /@snapshots
        options: "defaults,noatime,compress=zstd:1,space_cache=v2,ssd,discard=async"
