stages:
  - build_ppa
  - compose_ostree_and_flatpak
  - deploy

variables:
  CFLAGS: "-march=x86-64-v3 -O3"
  CXXFLAGS: "-march=x86-64-v3 -O3"
  OSTREE_BRANCH: "kepler/testing/x86_64-v3/gnome"

build_packages:
  stage: build_ppa
  image: debian:testing
  script:
    - echo "Compiling Debian Testing packages with x86-64-v3 optimization..."
    - apt-get update && apt-get install -y build-essential debhelper devscripts
    - mkdir -p build_out

compose_ostree:
  stage: compose_ostree_and_flatpak
  image: debian:testing
  script:
    - echo "Composing OSTree commit..."
    - apt-get update && apt-get install -y ostree
    - ostree --repo=ostree-repo init --mode=archive-z2
  artifacts:
    paths:
      - build_out/

deploy_release:
  stage: deploy
  script:
    - echo "Deploying artifacts to production mirrors..."
  only:
    - tags
